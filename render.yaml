# render.yaml
# Place this file at the root of your GitHub repo.
# Render reads it automatically when you connect the repo.
# It provisions a Node.js web service and a free PostgreSQL database,
# then wires DATABASE_URL between them automatically.

services:
  - type: web
    name: relay-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: relay-db
          property: connectionString

databases:
  - name: relay-db
    plan: free
    databaseName: relay
